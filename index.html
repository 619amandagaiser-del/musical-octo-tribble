<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title> 
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #8a2be2; --bg: #03070b; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-btn.active { color: var(--accent); border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(138,43,226,0.1) 0%, transparent 100%); }
        iframe { width: 100%; height: 100%; border: none; border-radius: 1.5rem; }
        #decoy-overlay { position: fixed; inset: 0; z-index: 99999; background: white; display: none; }
    </style>
</head>
<body class="flex">

    <div id="decoy-overlay"><iframe src="https://en.wikipedia.org/wiki/Mathematical_analysis"></iframe></div>

    <nav class="w-20 md:w-64 bg-black border-r border-white/5 flex flex-col p-6 z-50">
        <div class="mb-10 p-2 bg-purple-600/5 rounded-xl border border-purple-500/10">
            <h1 class="font-black text-[10px] text-purple-400 uppercase tracking-tighter">Vista Unified</h1>
            <p class="text-[7px] text-gray-500 font-bold uppercase">Workstation v61</p>
        </div>
        
        <div class="space-y-1 flex-1 overflow-y-auto">
            <button onclick="switchView('calc')" id="btn-calc" class="sidebar-btn active w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">📐 Calculator</button>
            <button onclick="switchView('proxy')" id="btn-proxy" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">🌐 Shadow Bridge</button>
            <button onclick="switchView('games')" id="btn-games" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">🎮 Games</button>
            <button onclick="switchView('yt')" id="btn-yt" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">📺 Media</button>
        </div>
        
        <div class="pt-4 border-t border-white/5">
            <button onclick="triggerAIVision()" class="w-full p-3 text-[10px] font-black text-purple-400 uppercase hover:bg-purple-500/10 rounded-xl transition-all">🧠 AI Vision</button>
            <button onclick="toggleDecoy()" class="mt-2 w-full p-3 text-[9px] font-black uppercase text-red-500 glass rounded-xl">Panic Mode (`)</button>
        </div>
    </nav>

    <main class="flex-1 relative flex flex-col overflow-hidden bg-[#03070b]">
        <div id="calc-view" class="flex-1 p-4"><iframe src="https://calcsolver.net/"></iframe></div>

        <div id="proxy-view" class="hidden flex-1 p-8 flex flex-col items-center justify-center">
            <div class="max-w-2xl w-full text-center">
                <h2 class="text-4xl font-black italic text-purple-500 uppercase mb-4 tracking-tighter">Shadow Bridge</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-10 tracking-widest leading-loose">
                    Injected sites launch in a separate <span class="text-white underline font-black">Ghost Tab</span>.<br> 
                    History stays clean. Filters stay bypassed.
                </p>
                
                <div class="glass p-10 rounded-[3rem] border-white/5 shadow-2xl">
                    <input type="text" id="proxy-url" placeholder="Enter URL (e.g. discord.com)" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-white focus:border-purple-500 outline-none transition-all font-mono text-center mb-8">
                    
                    <div class="grid grid-cols-1 gap-4">
                        <button onclick="launchGhostTab('croxy')" class="p-5 bg-purple-600 rounded-2xl font-black text-xs uppercase hover:bg-purple-500 hover:scale-[1.02] active:scale-95 transition-all shadow-[0_0_30px_rgba(138,43,226,0.3)]">
                            Launch via Engine 1 (Primary)
                        </button>
                        <button onclick="launchGhostTab('proxyium')" class="p-5 glass border-white/10 rounded-2xl font-black text-xs uppercase hover:bg-white/5 transition-all">
                            Launch via Engine 2 (Secondary)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="games-view" class="hidden flex-1 overflow-y-auto p-8"><div id="game-grid" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div></div>
        <div id="yt-view" class="hidden flex-1 p-6"><iframe src="https://www.youtube.com/embed?listType=search&list=math+tutorials"></iframe></div>
    </main>

    <script>
        function switchView(v) {
            ['calc-view', 'proxy-view', 'games-view', 'yt-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+v).classList.add('active');
            document.getElementById(v + '-view').classList.remove('hidden');
        }

        // THE GHOST-TAB INJECTION LOGIC
        function launchGhostTab(engine) {
            let url = document.getElementById('proxy-url').value;
            if (!url) { alert("Input Required."); return; }
            if (!url.startsWith('http')) url = 'https://' + url;

            let proxyBase = (engine === 'croxy') 
                ? "https://www.croxyproxy.com/_p.php?u=" 
                : "https://proxyium.com/search?url=";

            const finalUrl = proxyBase + encodeURIComponent(url);
            
            // 1. Open a blank tab
            const win = window.open('about:blank', '_blank');
            
            // 2. Cloak the tab
            win.document.title = 'Calculator'; 
            
            // 3. Inject a full-screen frame into the new tab
            // This prevents the original G-HUB from lagging or being seen
            const f = win.document.createElement('iframe');
            f.style.position = "fixed";
            f.style.top = "0";
            f.style.left = "0";
            f.style.width = "100%";
            f.style.height = "100%";
            f.style.border = "none";
            f.src = finalUrl;
            
            win.document.body.appendChild(f);
        }

        // (Previous Game/AI Logic stays the same)
        async function loadGames() {
            const grid = document.getElementById('game-grid');
            try {
                const res = await fetch('https://raw.githubusercontent.com/selenite-cc/selenite-old/main/games.json');
                const data = await res.json();
                Object.keys(data).slice(0, 20).forEach(key => {
                    const game = data[key];
                    const card = document.createElement('div');
                    card.className = "glass p-3 rounded-3xl cursor-pointer text-center hover:scale-105 transition-all";
                    card.onclick = () => launchGhostTabDirect(`https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${key}/index.html`);
                    card.innerHTML = `<img src="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${key}/${game.img || 'cover.svg'}" class="w-full aspect-square object-cover rounded-2xl mb-2"><div class="text-[9px] font-black text-gray-500 uppercase truncate">${game.name || key}</div>`;
                    grid.appendChild(card);
                });
            } catch(e) {}
        }

        function launchGhostTabDirect(url) {
            const win = window.open('about:blank', '_blank');
            win.document.title = 'Calculator';
            const f = win.document.createElement('iframe');
            f.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;";
            f.src = url;
            win.document.body.appendChild(f);
        }

        async function triggerAIVision() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" } });
                stream.getTracks().forEach(t => t.stop());
                window.open('https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat', 'CalcAI', 'width=450,height=700');
            } catch (e) {}
        }

        function toggleDecoy() {
            const d = document.getElementById('decoy-overlay');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        window.addEventListener('keydown', (e) => { if (e.key === '`') toggleDecoy(); });
        loadGames();
    </script>
</body>
</html>
