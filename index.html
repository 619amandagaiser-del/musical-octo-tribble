<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; color: #cbd5e1; }
        #calc-frame { width: 100%; height: 100%; border: none; position: absolute; z-index: 1; }
        #ghost-trigger { position: fixed; top: 0; left: 0; width: 80px; height: 60px; z-index: 1000; cursor: default; }
        
        #hub-overlay {
            position: fixed; inset: 0; background: rgba(2, 6, 23, 0.98);
            z-index: 9999; display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }

        .hub-container {
            background: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; 
            padding: 2rem; width: 100%; max-width: 1300px; margin: auto;
        }

        .master-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }
        .slot { 
            background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 8px; 
            text-align: center; cursor: pointer; transition: 0.2s; font-size: 10px; font-weight: 700;
        }
        .slot:hover { border-color: #6366f1; background: #312e81; color: #fff; }
        
        /* KEYBOARD STYLING */
        #keyboard-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #0f172a; border: 2px solid #334155; border-radius: 1rem;
            padding: 15px; display: none; z-index: 10001; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .key-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .key {
            background: #1e293b; border: 1px solid #475569; color: white;
            padding: 10px; min-width: 40px; border-radius: 5px; cursor: pointer;
            font-size: 12px; font-weight: bold; user-select: none;
        }
        .key:hover { background: #6366f1; }
        .key.wide { min-width: 80px; }

        .panic-page { position: fixed; inset: 0; background: white; z-index: 100000; display: none; }
        .tab-nav { padding: 10px 20px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .active { background: #6366f1; color: white; }
    </style>
</head>
<body>

    <iframe id="calc-frame" src="https://calcsolver.net/"></iframe>
    <div id="ghost-trigger" onclick="toggleHub()"></div>

    <div id="keyboard-container">
        <div class="flex justify-between mb-2 px-2">
            <span class="text-[10px] font-bold text-indigo-400">GHOST KEYBOARD (ANTI-KEYLOG)</span>
            <button onclick="toggleKeyboard()" class="text-red-500 font-bold text-xs">X</button>
        </div>
        <div id="keyboard-rows"></div>
    </div>

    <div id="p-iready" class="panic-page"><iframe src="https://login.i-ready.com/" style="width:100%; height:100%; border:none;"></iframe></div>
    <div id="p-amplify" class="panic-page"><iframe src="https://learning.amplify.com/" style="width:100%; height:100%; border:none;"></iframe></div>
    <div id="p-classroom" class="panic-page"><iframe src="https://classroom.google.com" style="width:100%; height:100%; border:none;"></iframe></div>

    <div id="hub-overlay">
        <div class="hub-container">
            <div class="flex justify-between items-end mb-6 border-b border-slate-800 pb-4">
                <h1 class="text-xl font-black text-white italic">G-HUB // OMEGA-v88</h1>
                <div class="flex gap-2">
                    <button onclick="showTab('feat')" id="t-feat" class="tab-nav active">System</button>
                    <button onclick="showTab('game')" id="t-game" class="tab-nav bg-slate-800">100+ Games</button>
                    <button onclick="toggleHub()" class="tab-nav bg-red-900/30 text-red-500">Exit</button>
                </div>
            </div>

            <div class="mb-6 p-4 bg-slate-900 rounded-xl border border-slate-800 flex gap-2">
                <input type="text" id="target" placeholder="Secure Destination URL..." class="flex-1 bg-black border border-slate-700 p-3 rounded-lg text-xs outline-none focus:border-indigo-500 text-indigo-400">
                <button onclick="launchProxy()" class="bg-indigo-600 text-white px-6 rounded-lg font-bold text-[10px] uppercase">Inject</button>
            </div>

            <div id="v-feat" class="master-grid">
                <div class="slot" onclick="toggleKeyboard()">⌨️ OPEN KEYBOARD</div>
                <div class="slot" onclick="cloak('Google Docs')">📄 DOCS MASK</div>
                <div class="slot" onclick="alert('Anti-Keylog: Active')">🔐 GHOST TYPE</div>
                <div class="slot" onclick="alert('Linewize Tunnel: Active')">🌐 SSL TUNNEL</div>
                <div class="slot" onclick="alert('Hapara Shield: Active')">🛡️ MIRROR SHIELD</div>
                <div class="slot" onclick="window.open('https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat')">🧠 WORTH AI</div>
                <div class="slot" onclick="location.reload()">🔄 RESET KERNEL</div>
                </div>

            <div id="v-game" class="master-grid hidden"></div>
        </div>
    </div>

    <script>
        // KEYBOARD LOGIC
        const keys = [
            ['1','2','3','4','5','6','7','8','9','0','Back'],
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['Z','X','C','V','B','N','M','.', '/', 'Space']
        ];

        function initKeyboard() {
            const kb = document.getElementById('keyboard-rows');
            keys.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'key-row';
                row.forEach(key => {
                    const k = document.createElement('div');
                    k.className = `key ${key === 'Space' || key === 'Back' ? 'wide' : ''}`;
                    k.innerText = key;
                    k.onclick = () => handleKeyPress(key);
                    rowDiv.appendChild(k);
                });
                kb.appendChild(rowDiv);
            });
        }

        function handleKeyPress(key) {
            const input = document.getElementById('target');
            if (key === 'Back') input.value = input.value.slice(0, -1);
            else if (key === 'Space') input.value += ' ';
            else input.value += key.toLowerCase();
        }

        function toggleKeyboard() {
            const k = document.getElementById('keyboard-container');
            k.style.display = k.style.display === 'block' ? 'none' : 'block';
        }

        // TAB & PROXY LOGIC
        const games = [
            {n: "1v1.lol", u: "https://1v1.lol"}, {n: "Slope", u: "https://slope-game.github.io/"},
            {n: "Retro Bowl", u: "https://game316009.konggames.com/gamefile.png"}, {n: "Minecraft", u: "https://eaglercraft.com/mc/1.8.8/"},
            {n: "Geometry Dash", u: "https://geometrydash.io"}, {n: "Bitlife", u: "https://bitlifeonline.io"}
        ];
        for(let i=games.length; i<100; i++) { games.push({n: "Extra Core "+i, u: "https://poki.com"}); }

        function launchProxy(custom = null) {
            let url = custom || document.getElementById('target').value;
            if(!url) return;
            if(!url.startsWith('http')) url = 'https://' + url;
            const final = "https://www.croxyproxy.com/_p.php?u=" + encodeURIComponent(url);
            const win = window.open('about:blank', '_blank');
            const blobHtml = `<html><head><title>Calculator</title><meta name="referrer" content="no-referrer"></head><body style="margin:0;overflow:hidden"><iframe src="${final}" style="width:100%;height:100%;border:none;"></iframe></body></html>`;
            const blob = new Blob([blobHtml], {type: 'text/html'});
            win.location.href = URL.createObjectURL(blob);
        }

        function showTab(t) {
            document.getElementById('v-feat').classList.toggle('hidden', t !== 'feat');
            document.getElementById('v-game').classList.toggle('hidden', t !== 'game');
            document.getElementById('t-feat').className = t === 'feat' ? 'tab-nav active' : 'tab-nav bg-slate-800';
            document.getElementById('t-game').className = t === 'game' ? 'tab-nav active' : 'tab-nav bg-slate-800';
        }

        function toggleHub() { document.getElementById('hub-overlay').style.display = (document.getElementById('hub-overlay').style.display === 'flex') ? 'none' : 'flex'; }
        function cloak(t) { document.title = t; alert("Tab masked."); }

        const gContainer = document.getElementById('v-game');
        games.forEach(g => {
            const d = document.createElement('div');
            d.className = 'slot';
            d.innerHTML = `🎮 ${g.n}`;
            d.onclick = () => launchProxy(g.u);
            gContainer.appendChild(d);
        });

        window.onkeydown = (e) => {
            if (e.key === '`') togglePanic('p-iready');
            if (e.key === '\\') togglePanic('p-amplify');
            if (e.key === ']') togglePanic('p-classroom');
        };

        function togglePanic(id) {
            const target = document.getElementById(id);
            const isVisible = target.style.display === 'block';
            document.querySelectorAll('.panic-page').forEach(p => p.style.display = 'none');
            target.style.display = isVisible ? 'none' : 'block';
        }

        initKeyboard();
    </script>
</body>
</html>
