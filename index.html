<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vista Unified // TITAN</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #5ca3ff; --bg: #03070b; --glass: rgba(255, 255, 255, 0.03); }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            margin: 0; 
            display: flex;
        }

        /* Glassmorphism UI */
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Sidebar Styling */
        .sidebar-btn { 
            transition: all 0.2s ease; 
            border-left: 3px solid transparent; 
            color: #6b7280; 
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            width: 100%;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .sidebar-btn.active { 
            color: var(--accent); 
            border-left: 3px solid var(--accent); 
            background: linear-gradient(90deg, rgba(92,163,255,0.1) 0%, transparent 100%); 
        }

        /* Content Area */
        main { flex: 1; position: relative; display: flex; flex-direction: column; }
        .view-pane { flex: 1; width: 100%; height: 100%; display: none; }
        .view-pane.active { display: block; }

        /* Stealth Overlay */
        #decoy-overlay { position: fixed; inset: 0; z-index: 99999; background: white; display: none; }
        
        /* Object/Iframe consistency */
        object, iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="decoy-overlay">
        <iframe src="https://en.wikipedia.org/wiki/Special:Random"></iframe>
        <div onclick="toggleDecoy()" class="fixed bottom-0 right-0 w-16 h-16 cursor-help"></div>
    </div>

    <nav class="w-64 bg-black border-r border-white/5 flex flex-col p-6 z-50">
        <div class="mb-10 p-4 bg-blue-600/5 rounded-xl border border-blue-500/10">
            <h1 class="font-black text-[10px] text-blue-400 uppercase tracking-tighter">Vista Unified</h1>
            <p class="text-[7px] text-gray-500 font-bold">TITAN v35 // SYSTEM ACTIVE</p>
        </div>

        <div class="space-y-1 flex-1">
            <button onclick="switchView('solver')" id="btn-solver" class="sidebar-btn active">📟 Solver</button>
            <button onclick="switchView('ai')" id="btn-ai" class="sidebar-btn">🧠 Titan AI</button>
            <button onclick="switchView('cloak')" id="btn-cloak" class="sidebar-btn">🕶️ Proxy</button>
            <button onclick="switchView('chat')" id="btn-chat" class="sidebar-btn">💬 Lobby</button>
        </div>

        <div class="mt-auto pt-6 border-t border-white/5">
            <button onclick="toggleDecoy()" class="w-full p-3 glass rounded-xl text-[9px] font-black uppercase text-red-500 hover:bg-red-500/10 transition-all">Panic Key ( ` )</button>
        </div>
    </nav>

    <main>
        <div id="view-solver" class="view-pane active">
            <object data="https://calcsolver.net/"></object>
        </div>

        <div id="view-ai" class="view-pane p-6">
            <div class="glass h-full rounded-3xl overflow-hidden">
                <iframe src="https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat"></iframe>
            </div>
        </div>

        <div id="view-cloak" class="view-pane p-6">
            <div class="flex flex-col items-center justify-center h-full">
                <div class="glass p-10 rounded-[40px] w-full max-w-lg text-center">
                    <h2 class="text-3xl font-black mb-6 uppercase italic">Shadow Link</h2>
                    <input type="text" id="cloak-url" placeholder="https://..." class="w-full bg-black/50 border border-white/10 p-4 rounded-2xl mb-4 text-center outline-none focus:border-blue-500">
                    <button onclick="launchManualCloak()" class="w-full bg-blue-600 p-4 rounded-2xl font-black uppercase tracking-widest">Execute Stealth</button>
                </div>
            </div>
        </div>

        <div id="view-chat" class="view-pane p-6 flex flex-col">
            <div id="chat-messages" class="flex-1 glass rounded-2xl p-4 overflow-y-auto mb-4 space-y-2"></div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" onkeypress="if(event.key==='Enter') sendMessage()" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-xl outline-none" placeholder="Broadcast message...">
                <button onclick="sendMessage()" class="bg-blue-600 px-8 rounded-xl font-black uppercase">Send</button>
            </div>
        </div>
    </main>

    <script>
        // Tab Switching Logic
        function switchView(viewId) {
            // Hide all panes
            document.querySelectorAll('.view-pane').forEach(pane => pane.classList.remove('active'));
            // Deactivate all buttons
            document.querySelectorAll('.sidebar-btn').forEach(btn => btn.classList.remove('active'));
            
            // Show target
            document.getElementById('view-' + viewId).classList.add('active');
            document.getElementById('btn-' + viewId).classList.add('active');
        }

        // Stealth Launch (using Object instead of Iframe)
        function launchManualCloak() {
            let url = document.getElementById('cloak-url').value;
            if(!url.startsWith('http')) url = 'https://' + url;
            
            const win = window.open('about:blank', '_blank');
            if(win) {
                win.document.title = "Google Drive";
                win.document.body.style.margin = "0";
                win.document.body.style.height = "100vh";
                const obj = win.document.createElement('object');
                obj.data = url;
                obj.style.width = "100%";
                obj.style.height = "100%";
                win.document.body.appendChild(obj);
            }
        }

        // Panic Toggle
        function toggleDecoy() {
            const d = document.getElementById('decoy-overlay');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        // Key Listener for ` (Backtick)
        window.addEventListener('keydown', (e) => { 
            if(e.key === '`') toggleDecoy(); 
        });
    </script>
</body>
</html>
