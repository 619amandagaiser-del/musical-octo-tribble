<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs - Research</title>
    <link id="dynamic-favicon" rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #8b5cf6; --bg: #050505; --glass: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.08); }
        body { background-color: var(--bg); color: #e2e2e2; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        .glass { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--border); transition: all 0.2s ease; }
        .glass:hover { border-color: var(--accent); transform: translateY(-2px); }
        .active-tab { border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(139, 92, 246, 0.1) 0%, transparent 100%); }
        #ghost-overlay { position: fixed; inset: 0; background-image: url('https://i.imgur.com/3N4z7fR.png'); opacity: 0.1; pointer-events: none; z-index: 9998; display: none; background-size: cover; }
        #ai-side-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #ai-side-panel.open { transform: translateX(0); }
    </style>
</head>
<body class="flex">

    <div id="ghost-overlay"></div>

    <aside class="w-72 bg-[#0a0a0c] border-r border-white/5 flex flex-col z-50">
        <div class="p-6">
            <h1 class="text-2xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">TITAN<span class="text-white">OS</span></h1>
            <p class="text-[9px] font-mono text-gray-500 mt-1 uppercase">Moltbot.v2_Active</p>
        </div>

        <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
            <button onclick="setTab('home')" id="btn-home" class="w-full text-left p-3 rounded-xl text-xs font-bold text-gray-300 active-tab">🚀 Dashboard</button>
            <button onclick="setTab('games')" id="btn-games" class="w-full text-left p-3 rounded-xl text-xs font-bold text-gray-300">🎮 Game Vault</button>
            <button onclick="setTab('cinema')" id="btn-cinema" class="w-full text-left p-3 rounded-xl text-xs font-bold text-gray-300">🎬 Cinema Mode</button>
            <button onclick="toggleAI()" class="w-full text-left p-3 rounded-xl text-xs font-bold text-cyan-400 hover:bg-cyan-500/10">🤖 Moltbot AI</button>
            
            <div class="pt-6">
                <button onclick="toggleBio()" class="w-full text-left p-3 rounded-xl text-xs font-bold text-yellow-500">🛡️ Bio-Lock</button>
                <button onclick="toggleSettings()" class="w-full text-left p-3 rounded-xl text-xs font-bold text-blue-400">⚙️ Settings</button>
            </div>
        </nav>

        <div class="p-4 bg-black/40 border-t border-white/5">
            <div id="status-display" class="text-[9px] font-mono text-green-500 mb-2">NETWORK: ENCRYPTED</div>
            <textarea id="notes-area" class="w-full h-24 bg-black border border-white/10 rounded-lg p-2 text-[10px] font-mono text-gray-500 outline-none focus:border-purple-500" placeholder="Session Notes..."></textarea>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative">
        <header class="h-16 border-b border-white/5 flex items-center px-6 gap-4 bg-black/20 backdrop-blur-md">
            <input id="omnibox" type="text" class="flex-1 bg-white/5 border border-white/10 rounded-xl py-2 px-4 text-xs font-mono" placeholder="LAUNCH URL OR SEARCH..." onkeypress="if(event.key==='Enter') handleLaunch()">
            <button onclick="handleLaunch()" class="bg-purple-600 px-6 py-2 rounded-xl text-xs font-bold">LAUNCH</button>
        </header>

        <div id="content-area" class="flex-1 overflow-y-auto p-8">
            <div id="view-games" class="hidden grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
            
            <div id="view-home" class="space-y-6">
                <div class="glass p-10 rounded-[3rem] bg-gradient-to-br from-purple-900/10 to-transparent">
                    <h2 class="text-4xl font-black italic tracking-tighter mb-4">SYSTEM READY.</h2>
                    <p class="text-gray-400 text-sm max-w-lg leading-relaxed">Moltbot AI is now integrated into your core. Use the side panel to chat, generate code, or find new unblocked links.</p>
                </div>
            </div>

            <div id="view-cinema" class="hidden text-center pt-20">
                <h2 class="text-3xl font-black mb-8">TITAN CINEMA</h2>
                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="launch('https://vidsrc.to')" class="glass px-8 py-4 rounded-2xl font-bold">VidSrc</button>
                    <button onclick="launch('https://sflix.to')" class="glass px-8 py-4 rounded-2xl font-bold">SFlix</button>
                </div>
            </div>
        </div>

        <div id="ai-side-panel" class="fixed top-0 right-0 w-96 h-full bg-[#0a0a0c] border-l border-white/10 z-[100] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="font-black text-cyan-400 tracking-widest text-sm">MOLTBOT AI NODE</h3>
                <button onclick="toggleAI()" class="text-gray-500 hover:text-white">✕</button>
            </div>
            <div class="flex-1 overflow-hidden">
                <iframe src="https://619amandagaiser-del.github.io/moltbot/" class="w-full h-full border-none"></iframe>
            </div>
        </div>
    </main>

    <div id="bio-lock" class="hidden fixed inset-0 bg-black z-[10000] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
        <p class="mt-6 font-mono text-xs text-gray-500 uppercase tracking-widest">Update 88% - System Restarting</p>
    </div>

    <script>
        const proxyBase = "https://incognito.education/service/";
        const GAMES = [
            {n:"1v1.LOL", u:"https://1v1.lol"}, {n:"Krunker", u:"https://krunker.io"}, 
            {n:"Minecraft", u:"https://eaglercraft.com"}, {n:"Subway Surfers", u:"https://poki.com/en/g/subway-surfers"},
            {n:"Retro Bowl", u:"https://retrobowl.me"}, {n:"Cookie Clicker", u:"https://orteil.dashnet.org/cookieclicker/"},
            {n:"Suroi.io", u:"https://suroi.io"}, {n:"Slope", u:"https://kbhgames.com/game/slope-game"},
            {n:"BitLife", u:"https://bitlifeonline.com"}, {n:"Paper.io 2", u:"https://paper-io.com"}
            // Add your 50+ games here...
        ];

        function toggleAI() { document.getElementById('ai-side-panel').classList.toggle('open'); }
        function toggleBio() { document.getElementById('bio-lock').classList.toggle('hidden'); }

        function setTab(tab) {
            ['home', 'games', 'cinema'].forEach(t => {
                document.getElementById('view-'+t).classList.add('hidden');
                document.getElementById('btn-'+t).classList.remove('active-tab');
            });
            document.getElementById('view-'+tab).classList.remove('hidden');
            document.getElementById('btn-'+tab).classList.add('active-tab');
        }

        function launch(url) {
            let target = url.trim();
            if(!target.startsWith('http')) target = 'https://' + target;
            const encoded = btoa(target);
            const win = window.open('about:blank', '_blank');
            if(!win) return alert("Allow Popups!");
            win.document.write(`<html><head><title>Google Docs</title></head><body style="margin:0;overflow:hidden;background:#000;"><iframe src="${proxyBase + encoded}" style="width:100%;height:100vh;border:none;"></iframe></body></html>`);
        }

        function handleLaunch() {
            const query = document.getElementById('omnibox').value;
            launch(query.includes('.') ? query : 'https://google.com/search?q=' + query);
        }

        const grid = document.getElementById('view-games');
        GAMES.forEach(g => {
            const el = document.createElement('div');
            el.className = 'glass p-6 rounded-2xl cursor-pointer text-center text-[10px] font-bold uppercase';
            el.innerText = g.n;
            el.onclick = () => launch(g.u);
            grid.appendChild(el);
        });

        // Hotkeys
        window.onkeydown = (e) => {
            if(e.shiftKey && e.key === 'Escape') window.location.replace('https://classroom.google.com');
            if(e.key === '`') {
                const g = document.getElementById('ghost-overlay');
                g.style.display = g.style.display === 'block' ? 'none' : 'block';
            }
        };

        // Persistent Notes
        const n = document.getElementById('notes-area');
        n.value = localStorage.getItem('titan_notes') || '';
        n.oninput = () => localStorage.setItem('titan_notes', n.value);

        document.addEventListener('visibilitychange', () => {
            document.title = document.hidden ? "My Drive - Google Drive" : "Google Docs - Research";
        });
    </script>
</body>
</html>
