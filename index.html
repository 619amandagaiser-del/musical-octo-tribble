<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>G-HUB TITAN // V35 REBUILT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #5ca3ff; --bg: #03070b; --glass: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-btn { transition: all 0.2s ease; border-left: 3px solid transparent; opacity: 0.6; }
        .sidebar-btn.active { color: var(--accent); border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(92,163,255,0.1) 0%, transparent 100%); opacity: 1; }
        #decoy-overlay { position: fixed; inset: 0; z-index: 99999; background: white; display: none; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 12px; }
        ::-webkit-scrollbar { display: none; }
        .item-card { transition: transform 0.2s; }
        .item-card:hover { transform: translateY(-5px); border-color: var(--accent); }
    </style>
</head>
<body class="flex">

    <div id="decoy-overlay">
        <iframe src="https://en.wikipedia.org/wiki/Special:Random"></iframe>
    </div>

    <nav class="w-20 md:w-64 bg-black border-r border-white/5 flex flex-col p-6 z-50">
        <div class="mb-10 p-2 bg-blue-600/5 rounded-xl border border-blue-500/10">
            <h1 class="font-black text-[10px] text-blue-400 uppercase tracking-tighter">Vista Unified</h1>
            <p class="text-[7px] text-gray-500 font-bold uppercase">Titan Engine v35</p>
        </div>

        <div class="space-y-2 flex-1">
            <button onclick="switchView('games')" id="btn-games" class="sidebar-btn active w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">🎮 Database</button>
            <button onclick="switchView('ai')" id="btn-ai" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">🧠 Titan AI</button>
            <button onclick="switchView('cloak')" id="btn-cloak" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">🟣 Proxies</button>
            <button onclick="switchView('terminal')" id="btn-terminal" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">📟 Terminal</button>
        </div>
        
        <button onclick="toggleDecoy()" class="mt-4 p-4 glass rounded-2xl text-[9px] font-black uppercase text-red-500 border border-red-500/20">Stealth Mode ( ` )</button>
    </nav>

    <main class="flex-1 relative flex flex-col p-6 overflow-hidden">
        
        <div id="games-view" class="flex-1 flex flex-col">
            <input type="text" id="search-bar" oninput="searchGames()" placeholder="SEARCH DATABASE..." class="w-full mb-6 bg-white/5 border border-white/10 p-4 rounded-xl text-sm outline-none focus:border-blue-500 transition-all">
            <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 overflow-y-auto pr-2"></div>
        </div>

        <div id="ai-view" class="hidden flex-1">
            <div class="glass h-full rounded-3xl overflow-hidden flex flex-col">
                <div class="p-3 border-b border-white/5 bg-blue-500/5 text-[9px] font-black uppercase text-blue-400 px-6">Titan Academic Bridge</div>
                <iframe src="https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat"></iframe>
            </div>
        </div>

        <div id="cloak-view" class="hidden flex-1 flex flex-col items-center justify-center">
            <div class="glass p-12 rounded-[40px] text-center max-w-md border-blue-500/20">
                <h2 class="text-5xl font-black italic mb-2 tracking-tighter text-blue-400">SHADOW</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-8">External Proxy Bridge</p>
                <div class="flex flex-col gap-3">
                    <button onclick="launchExternal('https://gointerstellar.app')" class="w-full py-4 bg-blue-600 rounded-2xl font-black uppercase text-xs hover:bg-blue-500">Interstellar</button>
                    <button onclick="launchExternal('https://ai-wedge.github.io')" class="w-full py-4 glass rounded-2xl font-black uppercase text-xs">AI Wedge</button>
                </div>
            </div>
        </div>

        <div id="terminal-view" class="hidden flex-1 flex flex-col">
            <div class="glass flex-1 rounded-3xl overflow-hidden flex flex-col border-green-500/20">
                <div class="p-2 bg-black flex items-center gap-4 px-6 border-b border-white/5">
                    <span class="text-[9px] font-mono text-green-500">SYS_LOG:</span>
                    <input type="text" id="terminal-url" class="bg-transparent text-[10px] text-green-500 font-mono outline-none w-full" placeholder="ENTER SECURE URL AND PRESS ENTER..." onkeypress="if(event.key==='Enter') launchTerminal()">
                </div>
                <iframe id="terminal-frame" class="hidden flex-1"></iframe>
                <div id="terminal-placeholder" class="flex-1 flex items-center justify-center font-mono text-green-900 text-[10px] animate-pulse">SYSTEM_IDLE: AWAITING TERMINAL LINK...</div>
            </div>
        </div>

    </main>

    <script>
        let allGames = [];

        // 1. Initial Load
        async function init() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/selenite-cc/selenite-old/main/games.json');
                const data = await res.json();
                allGames = Object.keys(data).map(k => ({
                    title: data[k].name || k,
                    url: `https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${k}/index.html`,
                    img: `https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${k}/${data[k].img || 'cover.svg'}`
                }));
                render(allGames);
            } catch(e) { console.error("Database Connection Failed"); }
        }

        // 2. Navigation
        function switchView(v) {
            const views = ['games-view', 'ai-view', 'cloak-view', 'terminal-view'];
            views.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(v + '-view').classList.remove('hidden');
            document.getElementById('btn-' + v).classList.add('active');
        }

        // 3. Rendering
        function render(list) {
            const g = document.getElementById('grid');
            g.innerHTML = '';
            list.forEach(i => {
                const d = document.createElement('div');
                d.className = "item-card glass p-2 rounded-2xl cursor-pointer border border-white/5 hover:bg-white/5";
                d.onclick = () => launchExternal(i.url);
                d.innerHTML = `
                    <img src="${i.img}" class="w-full aspect-square object-cover rounded-xl mb-3" onerror="this.src='https://raw.githubusercontent.com/selenite-cc/selenite-old/main/cover.svg'">
                    <div class="text-[9px] font-black text-center truncate text-gray-400 uppercase px-1">${i.title}</div>
                `;
                g.appendChild(d);
            });
        }

        // 4. Functionality
        function searchGames() {
            const t = document.getElementById('search-bar').value.toLowerCase();
            const f = allGames.filter(g => g.title.toLowerCase().includes(t));
            render(f);
        }

        function launchTerminal() {
            const input = document.getElementById('terminal-url');
            const frame = document.getElementById('terminal-frame');
            const placeholder = document.getElementById('terminal-placeholder');
            let url = input.value;
            if(!url.startsWith('http')) url = 'https://' + url;
            frame.src = url;
            frame.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        function launchExternal(url) {
            const win = window.open('about:blank', '_blank');
            if(win) {
                win.document.title = 'Google Drive';
                const f = win.document.createElement('iframe');
                f.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;background:#000;";
                f.src = url;
                win.document.body.appendChild(f);
            } else { alert("Please allow pop-ups for this site!"); }
        }

        function toggleDecoy() {
            const d = document.getElementById('decoy-overlay');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        window.addEventListener('keydown', (e) => { if(e.key === '`') toggleDecoy(); });
        init();
    </script>
</body>
</html>
