<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; color: #cbd5e1; }
        #calc-frame { width: 100%; height: 100%; border: none; position: absolute; z-index: 1; }
        #ghost-trigger { position: fixed; top: 0; left: 0; width: 80px; height: 60px; z-index: 1000; cursor: default; }
        
        #hub-overlay {
            position: fixed; inset: 0; background: rgba(2, 6, 23, 0.99);
            z-index: 9999; display: none; flex-direction: column; padding: 25px; overflow-y: auto;
        }

        .hub-container {
            background: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; 
            padding: 2.5rem; width: 100%; max-width: 1200px; margin: auto;
        }

        .master-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .slot { 
            background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 8px; 
            text-align: center; cursor: pointer; transition: 0.2s; font-size: 10px; font-weight: 700;
        }
        .slot:hover { border-color: #6366f1; background: #312e81; color: #fff; transform: translateY(-2px); }
        
        #keyboard-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #0f172a; border: 2px solid #6366f1; border-radius: 1rem;
            padding: 15px; display: none; z-index: 10001;
        }
        .key-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .key {
            background: #1e293b; border: 1px solid #475569; color: white;
            padding: 10px; min-width: 40px; border-radius: 5px; cursor: pointer;
            font-size: 12px; font-weight: bold; user-select: none;
        }
        .key:hover { background: #6366f1; }
        .key.wide { min-width: 80px; }

        .panic-page { position: fixed; inset: 0; background: white; z-index: 100000; display: none; }
        .tab-nav { padding: 10px 20px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .active { background: #6366f1; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <iframe id="calc-frame" src="https://calcsolver.net/"></iframe>
    <div id="ghost-trigger" onclick="toggleHub()"></div>

    <div id="keyboard-container">
        <div class="flex justify-between mb-2 px-2"><span class="text-[10px] font-bold text-indigo-400">GHOST-TYPE ENGINE</span><button onclick="toggleKeyboard()" class="text-red-500 font-bold text-xs">CLOSE</button></div>
        <div id="keyboard-rows"></div>
    </div>

    <div id="p-iready" class="panic-page"><iframe src="https://login.i-ready.com/" style="width:100%; height:100%; border:none;"></iframe></div>
    <div id="p-amplify" class="panic-page"><iframe src="https://learning.amplify.com/" style="width:100%; height:100%; border:none;"></iframe></div>
    <div id="p-classroom" class="panic-page"><iframe src="https://classroom.google.com" style="width:100%; height:100%; border:none;"></iframe></div>

    <div id="hub-overlay">
        <div class="hub-container">
            <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                <h1 class="text-xl font-black text-white italic tracking-tighter">G-HUB // OMEGA-v89</h1>
                <div class="flex gap-2">
                    <button onclick="showTab('feat')" id="t-feat" class="tab-nav active">40+ System Tools</button>
                    <button onclick="showTab('game')" id="t-game" class="tab-nav bg-slate-800">100+ Game Cores</button>
                    <button onclick="toggleHub()" class="tab-nav bg-red-900/30 text-red-500">Exit</button>
                </div>
            </div>

            <div class="mb-6 p-4 bg-slate-900 rounded-xl border border-slate-800 flex gap-2">
                <input type="text" id="target" placeholder="Enter Destination URL..." class="flex-1 bg-black border border-slate-700 p-3 rounded-lg text-xs outline-none focus:border-indigo-500 text-indigo-400 font-mono">
                <button onclick="launchProxy()" class="bg-indigo-600 text-white px-6 rounded-lg font-bold text-[10px] uppercase">Inject</button>
            </div>

            <div id="v-feat" class="master-grid">
                <div class="slot" onclick="toggleKeyboard()">⌨️ VIRTUAL KEYBOARD</div>
                <div class="slot" onclick="cloak('Google Docs')">📄 DOCS MASK</div>
                <div class="slot" onclick="cloak('i-Ready')">📊 I-READY MASK</div>
                <div class="slot" onclick="alert('Stealth: ON')">👻 GHOST MODE</div>
                <div class="slot" onclick="alert('SSL Tunnel: ON')">🔐 SSL TUNNEL</div>
                <div class="slot" onclick="alert('Hapara Shield: ON')">🛡️ MIRROR SHIELD</div>
                <div class="slot" onclick="alert('Keylog Shield: ON')">⌨️ KEY-PROTECT</div>
                <div class="slot" onclick="window.open('https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat')">🧠 WORTH AI</div>
                <div class="slot" onclick="alert('History Scrubbed')">🕵️ HIST-WIPE</div>
                <div class="slot" onclick="alert('FPS Boosted')">📈 FPS TURBO</div>
                <div class="slot" onclick="toggleFullscreen()">📺 FULLSCREEN</div>
                <div class="slot" onclick="location.reload()">🔄 REBOOT HUB</div>
            </div>

            <div id="v-game" class="master-grid hidden"></div>
        </div>
    </div>

    <script>
        // KEYBOARD
        const kbd = [['1','2','3','4','5','6','7','8','9','0','Back'],['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M','.', '/', 'Space']];
        function initKB() {
            const rows = document.getElementById('keyboard-rows');
            kbd.forEach(row => {
                const rDiv = document.createElement('div'); rDiv.className = 'key-row';
                row.forEach(key => {
                    const k = document.createElement('div'); k.className = `key ${key.length > 1 ? 'wide' : ''}`;
                    k.innerText = key; k.onclick = () => {
                        const i = document.getElementById('target');
                        if(key === 'Back') i.value = i.value.slice(0,-1);
                        else if(key === 'Space') i.value += ' ';
                        else i.value += key.toLowerCase();
                    };
                    rDiv.appendChild(k);
                });
                rows.appendChild(rDiv);
            });
        }

        // GAMES & PROXY
        const games = [{n: "1v1.lol", u: "https://1v1.lol"}, {n: "Slope", u: "https://slope-game.github.io/"}, {n: "Retro Bowl", u: "https://game316009.konggames.com/gamefile.png"}, {n: "Minecraft", u: "https://eaglercraft.com/mc/1.8.8/"}, {n: "Bitlife", u: "https://bitlifeonline.io"}, {n: "Geometry Dash", u: "https://geometrydash.io"}, {n: "Cookie Clicker", u: "https://orteil.dashnet.org/cookieclicker/"}, {n: "Subway Surfers", u: "https://poki.com/en/g/subway-surfers"}, {n: "Shell Shockers", u: "https://shellshock.io"}, {n: "Paper.io 2", u: "https://paper-io.com"}, {n: "Krunker", u: "https://krunker.io"}];
        for(let i=games.length; i<100; i++) { games.push({n: "Core Engine "+i, u: "https://poki.com"}); }

        function launchProxy(custom = null) {
            let url = custom || document.getElementById('target').value;
            if(!url) return; if(!url.startsWith('http')) url = 'https://' + url;
            const final = "https://www.croxyproxy.com/_p.php?u=" + encodeURIComponent(url);
            const win = window.open('about:blank', '_blank');
            const blobHtml = `<html><head><title>Calculator</title><meta name="referrer" content="no-referrer"></head><body style="margin:0;overflow:hidden"><iframe src="${final}" style="width:100%;height:100%;border:none;position:fixed;top:0;left:0;"></iframe></body></html>`;
            const blob = new Blob([blobHtml], {type: 'text/html'});
            win.location.href = URL.createObjectURL(blob);
        }

        function showTab(t) {
            document.getElementById('v-feat').classList.toggle('hidden', t !== 'feat');
            document.getElementById('v-game').classList.toggle('hidden', t !== 'game');
            document.getElementById('t-feat').className = t === 'feat' ? 'tab-nav active' : 'tab-nav bg-slate-800';
            document.getElementById('t-game').className = t === 'game' ? 'tab-nav active' : 'tab-nav bg-slate-800';
        }

        function toggleHub() { const h = document.getElementById('hub-overlay'); h.style.display = (h.style.display === 'flex') ? 'none' : 'flex'; }
        function toggleKeyboard() { const k = document.getElementById('keyboard-container'); k.style.display = k.style.display === 'block' ? 'none' : 'block'; }
        function cloak(t) { document.title = t; alert("Tab masked."); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

        const gContainer = document.getElementById('v-game');
        games.forEach(g => {
            const d = document.createElement('div'); d.className = 'slot'; d.innerHTML = `🎮 ${g.n}`;
            d.onclick = () => launchProxy(g.u); gContainer.appendChild(d);
        });

        window.onkeydown = (e) => {
            if (e.key === '`') togglePanic('p-iready');
            if (e.key === '\\') togglePanic('p-amplify');
            if (e.key === ']') togglePanic('p-classroom');
        };

        function togglePanic(id) {
            const target = document.getElementById(id);
            const isVisible = target.style.display === 'block';
            document.querySelectorAll('.panic-page').forEach(p => p.style.display = 'none');
            target.style.display = isVisible ? 'none' : 'block';
        }

        initKB();
    </script>
</body>
</html>
