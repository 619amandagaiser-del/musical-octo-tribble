<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #f8f9fa; font-family: sans-serif; }
        
        /* FULL SCREEN CALCSOLVER */
        #main-frame { width: 100%; height: 100%; border: none; }

        /* THE STEALTH BUBBLE */
        /* Designed to look like a standard UI button */
        .sentinel-bubble {
            position: fixed; 
            bottom: 20px; 
            right: 20px;
            width: 45px; 
            height: 45px;
            background: #e2e8f0; /* Neutral grey, looks like part of the site */
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            z-index: 9999;
            transition: all 0.2s ease;
            border: 1px solid #cbd5e1;
        }
        
        /* Only shows blue when you actually hover over it */
        .sentinel-bubble:hover { background: #3b82f6; border-color: #2563eb; }
        .sentinel-bubble svg { width: 20px; height: 20px; fill: #64748b; transition: fill 0.2s; }
        .sentinel-bubble:hover svg { fill: white; }

        /* LABEL DISGUISED AS "CALC SETTINGS" */
        .ai-label {
            position: absolute; right: 60px;
            background: #1e293b; color: white;
            padding: 6px 12px; border-radius: 8px;
            font-size: 10px; font-weight: bold;
            opacity: 0; pointer-events: none; transition: 0.3s;
            white-space: nowrap;
        }
        .sentinel-bubble:hover .ai-label { opacity: 1; }

        /* EMERGENCY PANIC OVERLAY */
        #decoy { position: fixed; inset: 0; background: white; z-index: 100000; display: none; }
    </style>
</head>
<body>

    <iframe id="main-frame" src="https://calcsolver.net/"></iframe>

    <div id="decoy">
        <iframe src="https://classroom.google.com"></iframe>
    </div>

    <div class="sentinel-bubble" onclick="openInternalMenu()">
        <div class="ai-label">Calc_Core_Settings</div>
        <svg viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
    </div>

    <script>
        function openInternalMenu() {
            // A simple prompt is the fastest way to navigate without a teacher seeing a menu
            const cmd = prompt("CALC_SYSTEM_V2 \n- Enter 'ai' for Worth Analysis\n- Enter 'proxy' for Shadow Bridge\n- Enter 'decoy' for Panic Mode");
            
            if (cmd === "ai") {
                triggerAIVision();
            } else if (cmd === "proxy") {
                launchProxy();
            } else if (cmd === "decoy") {
                toggleDecoy();
            }
        }

        async function triggerAIVision() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" } });
                stream.getTracks().forEach(t => t.stop());
                window.open('https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat', 'CalcAI', 'width=450,height=700');
            } catch (e) {}
        }

        function launchProxy() {
            const win = window.open('about:blank', '_blank');
            win.document.title = 'Calculator'; // Even the proxy tab is named Calculator
            const f = win.document.createElement('iframe');
            f.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;";
            f.src = "https://ai-wedge.github.io"; 
            win.document.body.appendChild(f);
        }

        function toggleDecoy() {
            const d = document.getElementById('decoy');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === '`') toggleDecoy(); // Panic key
        });
    </script>
</body>
</html>
