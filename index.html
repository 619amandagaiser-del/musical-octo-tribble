    <style>
        :root { --primary: #e50914; --bg: #050505; }
        body { 
            background: var(--bg); color: white; font-family: 'Inter', sans-serif; 
            overflow: hidden; height: 100vh; width: 100vw; margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .sidebar-btn.active { background: var(--primary); box-shadow: 0 0 30px rgba(229, 9, 20, 0.4); transform: scale(1.05); }
        
        .item-card { transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05); }
        .item-card:active { transform: scale(0.95); border-color: var(--primary); }

        /* Smooth Scroll */
        #grid-container { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { display: none; }

        /* Fix for iPad Keyboard focus */
        iframe:focus { outline: none; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        :root { --accent: #5ca3ff; --bg: #03070b; --nav: #0d1117; --glass: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-btn.active { color: var(--accent); border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(92,163,255,0.1) 0%, transparent 100%); }
        .shadow-browser { background: #000; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .shadow-logo-text { font-size: 80px; font-weight: 900; color: var(--accent); letter-spacing: -4px; text-shadow: 0 0 50px var(--accent); opacity: 0.8; }
        #decoy-overlay { position: fixed; inset: 0; z-index: 99999; background: white; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="flex">

        </div>
        <button onclick="toggleDecoy()" class="mt-4 p-4 glass rounded-2xl text-[9px] font-black uppercase text-red-500 border-red-500/10">Stealth Mode</button>

    <main class="flex-1 flex flex-col relative overflow-hidden">
        <header class="p-6 flex items-center gap-4">

    <main class="flex-1 relative flex flex-col p-6 overflow-hidden">
        
        <div id="grid-container" class="flex-1 overflow-y-auto"><div id="grid" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div></div>

            <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>

        <div id="cloak-view" class="hidden flex-1 flex flex-col items-center justify-center p-6">

                <h2 class="text-2xl font-black italic mb-4 uppercase">Launch Proxy</h2>
                <input type="text" id="cloak-url" placeholder="https://..." class="w-full bg-black/50 border border-white/10 p-4 rounded-xl mb-4 outline-none">
                <button onclick="launchCloak()" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase italic">Launch Invisible</button>
        <div id="cloak-view" class="hidden flex-1">

                        <button onclick="launchCloak('https://ai-wedge.github.io')" class="px-8 py-4 bg-blue-600 rounded-full font-black text-xs uppercase">Launch AI Wedge</button>

                <button onclick="sendMessage()" class="bg-red-600 px-8 rounded-xl font-black uppercase italic">Send</button>
        <div id="hidden-browser-view" class="hidden flex-1 flex flex-col">
            <div class="glass flex-1 rounded-3xl overflow-hidden flex flex-col">
                <div class="p-2 bg-black flex items-center gap-4 px-6 border-b border-white/5">
                    <span class="text-[9px] font-mono text-green-500">SYS_LOG:</span>
                    <input type="text" id="browser-url" class="bg-transparent text-[10px] text-green-500 outline-none w-full" placeholder="Enter URL..." onkeypress="if(event.key==='Enter') launchHiddenTab()">
                </div>
                <iframe id="browser-frame" class="hidden"></iframe>
                <div id="browser-placeholder" class="flex-1 flex items-center justify-center font-mono text-green-900 text-[10px]">Awaiting terminal link...</div>

    <div id="player" class="fixed inset-0 bg-black z-[100] hidden flex flex-col">
        <div class="p-3 bg-zinc-950 flex justify-between items-center border-b border-white/5">

        <div id="settings-view" class="hidden flex-1 p-10">

                <p class="text-[10px] font-black text-gray-500 mb-4">THEME COLOR</p>
                <input type="color" id="color-picker" oninput="updateTheme(this.value)" class="w-full h-12 bg-transparent border-none cursor-pointer">

        <iframe id="video-frame" 
                class="w-full h-full border-none" 
                allow="autoplay; gamepad; haptic-feedback; keyboard"

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, onDisconnect, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_dYbJKb9EjfENjdmrhE0UvHPPBt5cWkY",
            authDomain: "moonlight-a12a1.firebaseapp.com",
            databaseURL: "https://moonlight-a12a1-default-rtdb.firebaseio.com",
            projectId: "moonlight-a12a1",
            storageBucket: "moonlight-a12a1.firebasestorage.app",
            messagingSenderId: "508476856908",
            appId: "1:508476856908:web:59598f0583994deb54b2e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'messages');

        window.sendMessage = () => {
            const input = document.getElementById('chat-input');
            if(input.value.trim() === "/clear_titan_99") { remove(chatRef); input.value = ""; return; }
            if(input.value.trim()) {
                push(chatRef, { user: localStorage.getItem('ghub_user'), text: input.value });
                input.value = "";
            }
        };

        onChildAdded(chatRef, (s) => {
            const d = s.val();
            const m = document.getElementById('chat-messages');
            const el = document.createElement('div');
            el.className = "bg-white/5 p-3 rounded-xl border-l-2 border-red-600";
            el.innerHTML = `<div class="text-[8px] font-black text-red-600">${d.user}</div><div class="text-xs">${d.text}</div>`;
            m.appendChild(el);
            m.scrollTop = m.scrollHeight;
        });

        const u = localStorage.getItem('ghub_user') || 'User_'+Math.floor(Math.random()*999);
        localStorage.setItem('ghub_user', u);
        const pRef = ref(db, `online/${u.replace(/\W/g,'')}`);
        set(pRef, { name: u });
        onDisconnect(pRef).remove();
        onValue(ref(db, 'online'), (s) => document.getElementById('online-count').innerText = s.size || 1);
    </script>
    </main>

    <script>
        let allGames = [];
        let curView = 'games';

        const creative = [{ title: "My Sketchbook", url: "https://619amandagaiser-del.github.io/Sketchbook/", img: "https://raw.githubusercontent.com/swift502/Sketchbook/master/favicon.ico" }];
        const cinema = [{ title: "Sonic X", url: "https://drive.google.com/drive/u/2/folders/1rM_wiU6k3TbIDvrp3kt72-4BFWO4GC7G", img: "https://www.themoviedb.org/t/p/w600_and_h900_bestv2/7H8oV8Q8v8lT1n0y6r6Xo1D8V2.jpg" }];

        async function init() {
            const savedColor = localStorage.getItem('titan_theme') || '#5ca3ff';
            updateTheme(savedColor);
            try {
                const res = await fetch('https://raw.githubusercontent.com/selenite-cc/selenite-old/main/games.json');
                const data = await res.json();
                allGames = Object.keys(data).map(k => ({
                    title: data[k].name || k,
                    url: `https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${k}/index.html`,
                    img: `https://raw.githubusercontent.com/selenite-cc/selenite-old/main/${k}/${data[k].img || 'cover.svg'}`
                }));
                allGames = Object.keys(data).map(k => ({ title: data[k].name || k, url: `https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${k}/index.html`, img: `https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${k}/${data[k].img || 'cover.svg'}` }));
                render(allGames);
            } catch(e) { console.error("Game load failed"); }
            } catch(e) { console.error("Database Down"); }
        }

        function switchView(v) {
            curView = v;
            ['grid-container', 'ai-assistant-view', 'cloak-view', 'hidden-browser-view', 'settings-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+v).classList.add('active');
            
            ['grid-container', 'cloak-view', 'chat-view'].forEach(id => document.getElementById(id).classList.add('hidden'));

            if(v === 'games') { document.getElementById('grid-container').classList.remove('hidden'); render(allGames); }
            else if(v === 'creative') { document.getElementById('grid-container').classList.remove('hidden'); render(creative); }
            else if(v === 'cinema') { document.getElementById('grid-container').classList.remove('hidden'); render(cinema); }
            else if(v === 'cloak') document.getElementById('cloak-view').classList.remove('hidden');
            else if(v === 'chat') document.getElementById('chat-view').classList.remove('hidden');
            if(v === 'games') document.getElementById('grid-container').classList.remove('hidden');
            else document.getElementById(v + '-view').classList.remove('hidden');
        }

        function render(list) {
            const g = document.getElementById('grid');
            g.innerHTML = '';
            const g = document.getElementById('grid'); g.innerHTML = '';
            list.forEach(i => {
                const d = document.createElement('div');
                d.className = "item-card glass p-2 rounded-2xl cursor-pointer";
                d.onclick = () => {
                    if(curView === 'cinema') window.open(i.url, '_blank');
                    else {
                        document.getElementById('video-frame').src = i.url;
                        document.getElementById('player').classList.remove('hidden');
                        // Fix for iPad focus
                        setTimeout(() => { document.getElementById('video-frame').focus(); }, 1000);
                    }
                };
                d.innerHTML = `<img src="${i.img}" class="w-full aspect-[3/4] object-cover rounded-xl mb-2">
                               <div class="text-[9px] font-black uppercase text-center truncate text-gray-400">${i.title}</div>`;
                d.className = "glass p-2 rounded-2xl cursor-pointer hover:border-blue-500 transition-all";
                d.onclick = () => launchCloak(i.url);
                d.innerHTML = `<img src="${i.img}" class="w-full aspect-[3/4] object-cover rounded-xl mb-2" onerror="this.src='https://raw.githubusercontent.com/selenite-cc/selenite-old/main/cover.svg'"><div class="text-[8px] font-black text-center truncate text-gray-500 uppercase">${i.title}</div>`;
                g.appendChild(d);
            });
        }

        function searchGames() {
            const t = document.getElementById('search-bar').value.toLowerCase();
            const f = (curView === 'games' ? allGames : curView === 'creative' ? creative : cinema).filter(g => g.title.toLowerCase().includes(t));
            render(f);
        function launchCloak(url) {
            const win = window.open('about:blank', '_blank');
            if(win) {
                win.document.title = 'My Drive - Google Drive';
                const f = win.document.createElement('iframe'); f.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;"; f.src = url; f.allow = "autoplay; gamepad; haptic-feedback; keyboard; fullscreen"; win.document.body.appendChild(f);
            } else { alert("Enable Pop-ups in Chrome Settings!"); }
        }

        function launchCloak() {
            let u = document.getElementById('cloak-url').value;
            if(!u.startsWith('http')) u = 'https://' + u;
            const w = window.open('about:blank');
            w.document.body.innerHTML = `<iframe src="${u}" style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;"></iframe>`;
        async function triggerAIVision() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" } });
                stream.getTracks().forEach(t => t.stop());
                switchView('ai-assistant');
                document.getElementById('ai-status').style.opacity = "1";
                setTimeout(() => document.getElementById('ai-status').style.opacity = "0", 3000);
            } catch (err) { console.error("Vision Denied"); }
        }

        function closePlayer() {
            document.getElementById('video-frame').src = '';
            document.getElementById('player').classList.add('hidden');
        function launchHiddenTab() {
            const url = document.getElementById('browser-url').value;
            const f = document.getElementById('browser-frame');
            f.src = url.startsWith('http') ? url : 'https://' + url;
            f.classList.remove('hidden');
            document.getElementById('browser-placeholder').classList.add('hidden');
        }

        // Controller Listener
        window.addEventListener("gamepadconnected", () => {
            document.getElementById('gp-dot').className = "status-dot bg-green-500 mr-2";
            document.getElementById('gp-text').innerText = "Active";
        });

        function updateTheme(c) { document.documentElement.style.setProperty('--accent', c); localStorage.setItem('titan_theme', c); }
        function toggleDecoy() { const d = document.getElementById('decoy-overlay'); d.style.display = (d.style.display === 'block') ? 'none' : 'block'; }
        window.addEventListener('keydown', (e) => { if(e.key === '`') toggleDecoy(); });
        init();
    </script>
</body>
