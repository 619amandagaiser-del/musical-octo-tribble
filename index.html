<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Docs - Engineering Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #00ff88; --bg: #020408; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; height: 100vh; margin: 0; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .vpn-active { color: var(--accent) !important; border-color: var(--accent) !important; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        iframe { width: 100%; height: 100%; border: none; background: white; border-radius: 16px; }
        #decoy-overlay { position: fixed; inset: 0; z-index: 99999; background: white; display: none; }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="flex">

    <div id="decoy-overlay"><iframe src="https://en.wikipedia.org/wiki/Special:Random"></iframe></div>

    <nav class="w-64 bg-black border-r border-white/5 flex flex-col p-6 z-50">
        <div class="mb-8 text-center">
            <h1 class="font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-green-400 uppercase italic text-2xl tracking-tighter">Titan Omnis</h1>
            <p class="text-[7px] text-gray-500 font-bold uppercase tracking-[0.3em] mt-1">Firebase Sync Active</p>
        </div>
        
        <div class="space-y-2 flex-1 overflow-y-auto">
            <button onclick="setMode('direct')" id="btn-direct" class="vpn-active w-full p-3 glass rounded-xl text-[10px] font-bold uppercase text-left">📡 Direct</button>
            <button onclick="setMode('uv')" id="btn-uv" class="w-full p-3 glass rounded-xl text-[10px] font-bold uppercase text-left">🛰️ Ultraviolet</button>
            <button onclick="setMode('wayback')" id="btn-wayback" class="w-full p-3 glass rounded-xl text-[10px] font-bold uppercase text-left">⏳ Wayback</button>
            
            <div class="h-px bg-white/5 my-4"></div>
            <button onclick="toggleChat()" class="w-full p-3 glass rounded-xl text-[10px] font-bold uppercase text-left border-l-2 border-purple-500">💬 Chat Feed</button>
            <button onclick="launchPhantomWindow()" class="w-full p-3 glass rounded-xl text-[10px] font-bold uppercase text-left border-l-2 border-red-500 text-red-400">👻 Ghost Spawn</button>
        </div>
    </nav>

    <main class="flex-1 flex flex-col relative">
        <div class="bg-black/40 p-4 flex items-center gap-4 border-b border-white/5">
            <div class="flex-1 bg-black/80 border border-white/10 rounded-2xl px-5 py-3 flex items-center gap-4 shadow-inner">
                <span id="mode-tag" class="text-[9px] font-black uppercase text-blue-500">Direct</span>
                <input type="text" id="target-url" class="bg-transparent text-[12px] text-white outline-none w-full font-mono" placeholder="SECURE_UPLINK..." onkeypress="if(event.key==='Enter') launch()">
            </div>
            <button onclick="goHome()" class="p-3 glass rounded-2xl hover:bg-white/5">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </button>
        </div>

        <div class="flex-1 relative p-4">
            <div id="dashboard" class="absolute inset-0 z-10 p-10 bg-[#020408] overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div onclick="launchIReady()" class="glass p-8 rounded-[40px] cursor-pointer border-b-4 border-blue-600/20">
                        <h3 class="font-black text-xs uppercase text-gray-200">i-Ready Bypass</h3>
                    </div>
                    <div onclick="launchRemote()" class="glass p-8 rounded-[40px] cursor-pointer border-b-4 border-red-600/20">
                        <h3 class="font-black text-xs uppercase text-gray-200">Home Remote</h3>
                    </div>
                    <div onclick="launchDrive()" class="glass p-8 rounded-[40px] cursor-pointer border-b-4 border-yellow-600/20">
                        <h3 class="font-black text-xs uppercase text-gray-200">Drive Cloud</h3>
                    </div>
                </div>
            </div>
            
            <iframe id="browser-frame" class="hidden"></iframe>

            <div id="chat-panel" class="absolute top-4 right-4 bottom-4 w-80 glass rounded-3xl z-50 translate-x-[400px] transition-transform duration-500 flex flex-col overflow-hidden">
                <div class="p-4 bg-purple-600/10 border-b border-purple-500/20 font-black text-[10px] uppercase text-purple-400">Data Feed</div>
                <div id="chat-display" class="flex-1 overflow-y-auto p-4 font-mono text-[10px]"></div>
                <div class="p-4"><input type="text" id="chat-input" class="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-[10px] outline-none" placeholder="Transmit..."></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Config
        const firebaseConfig = {
            apiKey: "AIzaSyC_dYbJKb9EjfENjdmrhE0UvHPPBt5cWkY",
            authDomain: "moonlight-a12a1.firebaseapp.com",
            databaseURL: "https://moonlight-a12a1-default-rtdb.firebaseio.com",
            projectId: "moonlight-a12a1",
            storageBucket: "moonlight-a12a1.firebasestorage.app",
            messagingSenderId: "508476856908",
            appId: "1:508476856908:web:59598f0583994deb54b2e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.sendMessage = (text) => {
            if(!text) return;
            push(ref(db, 'chat'), { msg: text, user: "U_" + Math.floor(Math.random()*99), time: Date.now() });
        };

        onChildAdded(ref(db, 'chat'), (data) => {
            const display = document.getElementById('chat-display');
            display.innerHTML += `<div class="mb-1"><span class="text-blue-400">${data.val().user}:</span> ${data.val().msg}</div>`;
            display.scrollTop = display.scrollHeight;
        });

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') { sendMessage(e.target.value); e.target.value = ''; }
        });
    </script>

    <script>
        let mode = 'direct';
        const engines = {
            uv: "https://taco.tacosforlife.biz/service/", 
            wayback: "https://web.archive.org/web/2025/"
        };

        // BLOB CLOAK
        (function() {
            if (window.location.protocol !== 'blob:') {
                const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
                window.location.replace(URL.createObjectURL(blob));
            }
        })();

        document.addEventListener('visibilitychange', () => {
            document.title = document.hidden ? "Google Docs" : "Engineering Report";
        });

        window.setMode = (m) => {
            mode = m;
            document.getElementById('mode-tag').innerText = m;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('vpn-active'));
            document.getElementById('btn-' + m).classList.add('vpn-active');
        };

        window.launch = () => {
            const frame = document.getElementById('browser-frame');
            const dash = document.getElementById('dashboard');
            const input = document.getElementById('target-url');
            let url = input.value.trim();
            if(!url) return;
            if(!url.startsWith('http')) url = 'https://' + url;

            dash.classList.add('hidden');
            frame.classList.remove('hidden');

            if(mode === 'uv') frame.src = engines.uv + btoa(url);
            else if (mode === 'wayback') frame.src = engines.wayback + url;
            else frame.src = url;
            
            input.value = '';
        };

        window.toggleChat = () => document.getElementById('chat-panel').classList.toggle('translate-x-[400px]');
        window.goHome = () => { document.getElementById('dashboard').classList.remove('hidden'); document.getElementById('browser-frame').classList.add('hidden'); };
        window.launchIReady = () => { window.setMode('uv'); document.getElementById('target-url').value = "login.i-ready.com"; window.launch(); };
        window.launchPhantomWindow = () => {
            const win = window.open('about:blank', '_blank', 'width=1200,height=800');
            win.document.write(document.documentElement.outerHTML);
            window.location.replace("https://classroom.google.com");
        };
    </script>
</body>
</html>
