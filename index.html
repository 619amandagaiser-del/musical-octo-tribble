<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Docs - Research</title>
    <link id="favicon" rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #00ff88; --bg: #050505; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'JetBrains Mono', monospace; height: 100vh; overflow: hidden; }
        .glass { background: rgba(255,255,255,0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); }
        .neon-border { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        #ghost-sheet { position: fixed; inset: 0; z-index: 9999; background: url('https://i.imgur.com/3N4z7fR.png'); opacity: 0.1; pointer-events: none; display: none; }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: rgba(0, 255, 136, 0.1); animation: scan 4s linear infinite; z-index: 100; pointer-events: none; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="flex" oncontextmenu="return false;">

    <div id="ghost-sheet"></div>
    <div class="scanline"></div>

    <nav class="w-72 bg-black/90 border-r border-white/5 flex flex-col p-5 z-50">
        <div class="mb-6">
            <h1 class="text-xl font-black italic tracking-tighter text-white">TITAN<span class="text-green-400">SINGULARITY</span></h1>
            <div class="flex gap-2 mt-2">
                <div class="h-1 flex-1 bg-green-500/20 rounded-full overflow-hidden"><div id="cpu-bar" class="h-full bg-green-500" style="width: 40%"></div></div>
                <div class="h-1 flex-1 bg-blue-500/20 rounded-full overflow-hidden"><div id="ram-bar" class="h-full bg-blue-500" style="width: 65%"></div></div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scroll">
            <button onclick="switchView('dash')" class="w-full p-3 glass rounded-xl text-[10px] font-bold text-left hover:neon-border transition-all">🏠 CENTRAL HUB</button>
            <button onclick="switchView('cinema')" class="w-full p-3 glass rounded-xl text-[10px] font-bold text-left hover:neon-border">🎬 CINEMA MODE</button>
            <button onclick="toggleDev()" class="w-full p-3 glass rounded-xl text-[10px] font-bold text-left hover:neon-border">📟 AI TERMINAL</button>
            
            <div class="pt-4 border-t border-white/5">
                <p class="text-[8px] text-gray-500 uppercase font-black mb-2">Security Tools</p>
                <select id="cloak-select" onchange="changeCloak()" class="w-full bg-black border border-white/10 text-[9px] p-2 rounded-lg outline-none">
                    <option value="docs">Cloak: Google Docs</option>
                    <option value="drive">Cloak: My Drive</option>
                    <option value="canvas">Cloak: Canvas LMS</option>
                </select>
                <button onclick="toggleBioBreak()" class="w-full mt-2 p-2 glass text-[9px] rounded-lg">🛡️ BIO-BREAK LOCK</button>
            </div>

            <textarea id="crypt-notes" class="w-full h-32 bg-black/50 border border-white/5 rounded-xl p-3 text-[10px] mt-4 font-mono outline-none focus:border-green-500" placeholder="// ENCRYPTED_NOTES_STORAGE"></textarea>
        </div>

        <div class="mt-4 p-4 glass rounded-2xl text-[8px] text-gray-500">
            PING: <span id="ping-val">24ms</span> | NODE: US-WEST<br>
            [Shift+Esc] PANIC | [ ` ] GHOST
        </div>
    </nav>

    <main class="flex-1 flex flex-col relative">
        <header class="p-4 glass border-b border-white/5 flex gap-4 items-center">
            <div class="flex-1 bg-black/50 border border-white/10 rounded-xl px-4 py-2 flex items-center gap-3">
                <span class="text-[9px] text-green-500 font-black">UPLINK:</span>
                <input type="text" id="main-input" class="bg-transparent w-full outline-none text-xs font-mono" placeholder="URL, GAME, OR /CMD..." onkeypress="if(event.key==='Enter') executeCommand()">
            </div>
            <button onclick="selfDestruct()" class="p-2 bg-red-500/10 hover:bg-red-500/40 text-red-500 rounded-xl transition-all">☢️</button>
        </header>

        <div id="v-dash" class="flex-1 overflow-y-auto p-8 grid grid-cols-2 md:grid-cols-4 gap-4">
            </div>

        <div id="v-cinema" class="hidden flex-1 flex flex-col items-center justify-center p-10 bg-black">
            <div class="w-full max-w-4xl aspect-video glass rounded-[40px] flex items-center justify-center border-2 border-dashed border-white/10">
                <p class="text-gray-500 animate-pulse uppercase tracking-[1em]">Awaiting Cinema Feed</p>
            </div>
            <div class="flex gap-4 mt-8">
                <button class="px-6 py-2 glass rounded-full text-[10px] font-bold">VIDSRC 1</button>
                <button class="px-6 py-2 glass rounded-full text-[10px] font-bold">VIDSRC 2</button>
                <button class="px-6 py-2 glass rounded-full text-[10px] font-bold">SFLIX</button>
            </div>
        </div>

        <div id="dev-terminal" class="hidden absolute bottom-10 right-10 w-96 h-64 glass rounded-2xl p-4 shadow-2xl z-[100] border-t-4 border-green-500">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[9px] font-black text-green-500">TERMINAL.SINGULARITY_V4</span>
                <button onclick="toggleDev()" class="text-xs">×</button>
            </div>
            <div id="term-out" class="text-[9px] font-mono h-40 overflow-y-auto text-green-300">
                > Initializing AI Node...<br>
                > Bypassing restrictions...<br>
                > Ready.
            </div>
            <input type="text" class="w-full bg-black/50 mt-2 p-2 rounded text-[9px] font-mono border border-white/5 outline-none" placeholder="Enter query...">
        </div>
    </main>

    <div id="bio-break" class="hidden fixed inset-0 bg-black z-[10000] flex flex-col items-center justify-center">
        <div class="w-20 h-20 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-8 font-mono text-blue-500 text-xl uppercase tracking-widest">System Update: 44% Complete</p>
        <p class="mt-2 text-gray-600 text-[10px]">Do not turn off your computer.</p>
        <button onclick="toggleBioBreak()" class="mt-20 opacity-0 cursor-default">Unlock</button>
    </div>

    <script>
        const proxy = "https://v.st-re.am/service/";
        const games = [
            {t: "Krunker", u: "https://krunker.io"}, {t: "Wordle", u: "https://nytimes.com/games/wordle"},
            {t: "Agar.io", u: "https://agar.io"}, {t: "Slither", u: "https://slither.io"},
            {t: "Infinite Craft", u: "https://neal.fun/infinite-craft"}, {t: "Cookie Clicker", u: "https://orteil.dashnet.org/cookieclicker"},
            {t: "Shell Shock", u: "https://shellshock.io"}, {t: "Diep.io", u: "https://diep.io"}
            // [Imagine 42 more game objects here]
        ];

        // 1. DYNAMIC GRID
        const dash = document.getElementById('v-dash');
        games.forEach(g => {
            const btn = document.createElement('div');
            btn.className = 'glass p-6 rounded-[2rem] text-center cursor-pointer hover:neon-border';
            btn.onclick = () => launch(g.u);
            btn.innerHTML = `<div class="text-[10px] font-black text-white">${g.t}</div>`;
            dash.appendChild(btn);
        });

        // 2. LAUNCHER CORE
        function launch(target) {
            let url = target.includes('://') ? target : 'https://' + target;
            const blobContent = `<html><head><title>Google Docs</title><style>body,html{margin:0;height:100vh;overflow:hidden;background:#000;}iframe{width:100%;height:100%;border:none;}</style></head><body><iframe src="${proxy + btoa(url)}"></iframe></body></html>`;
            const blob = new Blob([blobContent], {type: 'text/html'});
            window.open(URL.createObjectURL(blob), '_blank');
        }

        // 3. COMMAND ENGINE
        function executeCommand() {
            const input = document.getElementById('main-input');
            const cmd = input.value.toLowerCase();
            if(cmd === '/yt') launch('youtube.com');
            else if(cmd === '/dc') launch('discord.com');
            else launch(cmd);
            input.value = '';
        }

        // 4. CLOAKING
        function changeCloak() {
            const c = document.getElementById('cloak-select').value;
            const fav = document.getElementById('favicon');
            if(c === 'drive') { document.title = "My Drive - Google Drive"; fav.href = "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"; }
            else if(c === 'canvas') { document.title = "Dashboard"; fav.href = "https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e1061570a1.ico"; }
            else { document.title = "Google Docs - Research"; fav.href = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"; }
        }

        // 5. SECURITY TOGGLES
        function toggleBioBreak() { document.getElementById('bio-break').classList.toggle('hidden'); }
        function toggleDev() { document.getElementById('dev-terminal').classList.toggle('hidden'); }
        function switchView(v) { 
            document.getElementById('v-dash').classList.toggle('hidden', v !== 'dash');
            document.getElementById('v-cinema').classList.toggle('hidden', v !== 'cinema');
        }

        // 6. HOTKEYS
        window.onkeydown = (e) => {
            if(e.shiftKey && e.key === 'Escape') window.location.replace('https://classroom.google.com');
            if(e.key === '`') { const g = document.getElementById('ghost-sheet'); g.style.display = g.style.display === 'block' ? 'none' : 'block'; }
        };

        // 7. FAKE STATS
        setInterval(() => {
            document.getElementById('cpu-bar').style.width = Math.floor(Math.random() * 40 + 20) + '%';
            document.getElementById('ping-val').innerText = Math.floor(Math.random() * 10 + 20) + 'ms';
        }, 3000);

        function selfDestruct() { if(confirm("NUCLEAR OPTION: Close all sessions?")) window.close(); }
    </script>
</body>
</html>
