<body class="flex">
    <div id="decoy-overlay">
        <iframe src="https://en.wikipedia.org/wiki/Special:Random"></iframe>
        <div onclick="toggleDecoy()" class="fixed bottom-0 right-0 w-16 h-16 cursor-help"></div>
    </div>

    <nav class="w-20 md:w-64 bg-black border-r border-white/5 flex flex-col p-6 z-50">
        <div class="mb-10 p-4 bg-blue-600/5 rounded-xl border border-blue-500/10">
            <h1 class="font-black text-[10px] text-blue-400 uppercase tracking-tighter">Vista Unified</h1>
            <p class="text-[7px] text-gray-500 font-bold uppercase">Portal v53 // TITAN</p>
        </div>

        <div class="space-y-1 flex-1 overflow-y-auto">
            <button onclick="switchView('solver')" id="btn-solver" class="sidebar-btn active w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">📟 CalcSolver</button>
            
            <button onclick="switchView('ai')" id="btn-ai" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">🧠 Titan AI</button>
            <button onclick="switchView('cloak')" id="btn-cloak" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">🕶️ Proxies</button>
            <button onclick="switchView('chat')" id="btn-chat" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase">💬 Lobby</button>
        </div>
        
        <button onclick="toggleDecoy()" class="mt-4 p-3 glass rounded-xl text-[9px] font-black uppercase text-red-500 border-red-500/20">Panic Mode ( ` )</button>
    </nav>

    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <div id="view-solver" class="flex-1 w-full h-full">
            <object data="https://calcsolver.net/" class="w-full h-full"></object>
        </div>

        <div id="view-ai" class="hidden flex-1 p-6 flex flex-col">
            <div class="glass flex-1 rounded-3xl overflow-hidden">
                <iframe src="https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat"></iframe>
            </div>
        </div>

        <div id="view-cloak" class="hidden flex-1 flex flex-col items-center justify-center p-6">
            <div class="glass p-10 rounded-[40px] w-full max-w-lg text-center">
                <h2 class="text-4xl font-black italic mb-2 uppercase">Shadow Proxy</h2>
                <input type="text" id="cloak-url" placeholder="Enter URL..." class="w-full bg-black border border-white/10 p-4 rounded-2xl mb-4 text-center outline-none">
                <button onclick="launchManualCloak()" class="w-full bg-blue-600 p-4 rounded-2xl font-black uppercase">Initialize Link</button>
            </div>
        </div>

        <div id="view-chat" class="hidden flex-1 p-6 flex flex-col">
            <div id="chat-messages" class="flex-1 glass rounded-2xl p-4 overflow-y-auto mb-4 space-y-3"></div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" onkeypress="if(event.key==='Enter') sendMessage()" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-xl outline-none" placeholder="Broadcast...">
                <button onclick="sendMessage()" class="bg-blue-600 px-8 rounded-xl font-black uppercase">Send</button>
            </div>
        </div>
    </main>

    <script>
        function switchView(v) {
            // Hide all views
            ['view-solver', 'view-ai', 'view-cloak', 'view-chat'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });

            // Remove active button classes
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            
            // Show selected view
            document.getElementById('view-' + v).classList.remove('hidden');
            document.getElementById('btn-' + v).classList.add('active');
        }

        function launchManualCloak() {
            let u = document.getElementById('cloak-url').value;
            if(!u.startsWith('http')) u = 'https://' + u;
            
            // Launch in about:blank for total stealth
            const win = window.open('about:blank', '_blank');
            win.document.body.innerHTML = `<object data="${u}" style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;"></object>`;
            win.document.title = "Google Drive";
        }

        function toggleDecoy() {
            const d = document.getElementById('decoy-overlay');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        window.addEventListener('keydown', (e) => { if(e.key === '`') toggleDecoy(); });
    </script>
</body>
</html>
