<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CalcSolver Pro</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; font-family: sans-serif; }

        /* THE INVISIBLE CORNER TRIGGER */
        #corner-trigger {
            position: fixed; top: 0; left: 0; width: 40px; height: 40px;
            z-index: 10000; cursor: pointer; background: transparent;
        }

        /* SIDEBAR PANEL */
        #sidebar {
            position: fixed; left: -400px; top: 0; width: 380px; height: 100vh;
            background: #1c2128; border-right: 3px solid #38bdf8;
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.1);
            z-index: 9999; display: flex; flex-direction: column;
            box-shadow: 20px 0 50px rgba(0,0,0,0.6); color: white;
        }
        #sidebar.active { left: 0; }

        /* MAIN VIEWPORT CONTAINERS */
        #main-container { width: 100vw; height: 100vh; position: relative; }
        .full-frame { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        
        /* Hiding the "non-active" frame */
        .hidden { display: none !important; }

        /* SIDEBAR UI ELEMENTS */
        .header { padding: 20px; background: #0d1117; text-align: center; border-bottom: 1px solid #30363d; }
        .game-grid { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        button { 
            background: #2d333b; border: 1px solid #444c56; color: #adbac7; 
            padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #38bdf8; color: #000; font-weight: bold; }

        .swap-btn { background: #38bdf8; color: #1c2128; margin: 15px; font-weight: bold; padding: 15px; }
        
        /* MINI PREVIEW BOX */
        .mini-preview { height: 200px; border-top: 1px solid #444c56; background: #000; position: relative; }
        .mini-label { position: absolute; top: 5px; right: 5px; font-size: 10px; background: rgba(0,0,0,0.5); padding: 2px 5px; }
    </style>
</head>
<body>

    <div id="corner-trigger" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div class="header">
            <div style="font-size: 12px; color: #38bdf8; letter-spacing: 2px;">WORKSTATION ALPHA</div>
        </div>

        <button class="swap-btn" onclick="swapViews()">🔄 SWAP WORK/PLAY</button>

        <div class="game-grid" id="game-list">
            </div>

        <div class="mini-preview">
            <span class="mini-label">PREVIEW</span>
            <div id="mini-content" style="width:100%; height:100%; overflow:hidden;">
                </div>
        </div>
        
        <button onclick="toggleSidebar()" style="margin: 10px; background: #444c56;">Close Menu</button>
    </div>

    <div id="main-container">
        <iframe id="calc-frame" class="full-frame" src="https://calcsolver.net/"></iframe>
        <iframe id="game-frame" class="full-frame hidden" src="https://starship-site.github.io/projects/slope/"></iframe>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const calcFrame = document.getElementById('calc-frame');
        const gameFrame = document.getElementById('game-frame');
        const miniContent = document.getElementById('mini-content');
        
        let isGaming = false;

        // 1. Toggle the Sidebar
        function toggleSidebar() {
            sidebar.classList.toggle('active');
        }

        // 2. Swap Main View between Calc and Game
        function swapViews() {
            isGaming = !isGaming;
            if (isGaming) {
                gameFrame.classList.remove('hidden');
                calcFrame.classList.add('hidden');
            } else {
                calcFrame.classList.remove('hidden');
                gameFrame.classList.add('hidden');
            }
            toggleSidebar();
        }

        // 3. Load Game
        function play(slug) {
            gameFrame.src = "https://starship-site.github.io/projects/" + slug + "/";
            if (!isGaming) swapViews();
            else toggleSidebar();
        }

        // 4. Generate Game Buttons
        const games = ['slope', 'retro-bowl', '1v1lol', 'tunnel-rush', 'geometry-dash', 'bitlife', 'eggy-car', 'minecraft', 'drive-mad', 'cookie-clicker'];
        const grid = document.getElementById('game-list');
        games.forEach(g => {
            let btn = document.createElement('button');
            btn.innerText = g.replace(/-/g, ' ').toUpperCase();
            btn.onclick = () => play(g);
            grid.appendChild(btn);
        });

        // 5. PANIC KEY: Pressing "~" (tilde) hides game immediately
        document.addEventListener('keydown', (e) => {
            if (e.key === "`" || e.key === "~") {
                isGaming = false;
                calcFrame.classList.remove('hidden');
                gameFrame.classList.add('hidden');
                sidebar.classList.remove('active');
            }
        });
    </script>
</body>
</html>
