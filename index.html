<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #a855f7; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        
        /* THE COVER: LIVE CALCSOLVER */
        #calc-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* THE SECRET SIDEBAR (Hidden until Hover) */
        #sidebar {
            position: fixed;
            left: -240px; /* Hidden off-screen */
            top: 0;
            bottom: 0;
            width: 260px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-col;
            padding: 30px 20px;
        }
        #sidebar:hover { left: 0; }
        #hover-trigger {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 15px;
            z-index: 999;
        }

        .nav-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            text-align: left;
            border-radius: 12px;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .nav-btn:hover { background: rgba(168, 85, 247, 0.1); color: #a855f7; }
        .nav-btn.active { background: rgba(168, 85, 247, 0.2); color: #a855f7; border-left: 3px solid #a855f7; }

        /* MODAL INTERFACES */
        .overlay-view {
            position: fixed;
            inset: 0;
            background: #030712;
            z-index: 500;
            display: none;
            flex-direction: column;
            padding: 50px;
            color: white;
        }
        
        #panic-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 10000;
            display: none;
        }
    </style>
</head>
<body>

    <iframe id="calc-frame" src="https://calcsolver.net/"></iframe>

    <div id="panic-overlay">
        <iframe src="https://classroom.google.com" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="hover-trigger"></div>

    <nav id="sidebar" class="flex flex-col">
        <div class="mb-10 px-2">
            <h1 class="text-white font-black text-xl italic tracking-tighter">G-HUB <span class="text-purple-500">v71</span></h1>
            <p class="text-[8px] text-gray-500 uppercase tracking-widest font-bold">Starship Architecture</p>
        </div>

        <button onclick="showView('calc')" class="nav-btn active">📐 Home Calculator</button>
        <button onclick="showView('bridge')" class="nav-btn">🚀 Shadow Bridge</button>
        <button onclick="showView('ai')" class="nav-btn">🧠 Worth AI</button>
        
        <div class="mt-auto p-4 bg-white/5 rounded-2xl">
            <p class="text-[9px] text-gray-400 font-bold uppercase mb-2">Security Level: 4</p>
            <button onclick="location.reload()" class="w-full py-2 bg-red-500/10 text-red-500 text-[10px] font-black uppercase rounded-lg border border-red-500/20">Emergency Wipe</button>
        </div>
    </nav>

    <div id="bridge-view" class="overlay-view">
        <div class="max-w-2xl mx-auto w-full text-center mt-20">
            <h2 class="text-5xl font-black italic mb-2">SHADOW BRIDGE</h2>
            <p class="text-xs text-gray-500 uppercase tracking-[0.6em] mb-12">Encrypted Starship Proxy</p>
            
            <div class="bg-gray-900 p-10 rounded-[3rem] border border-white/5 shadow-2xl">
                <input type="text" id="proxy-url" placeholder="ENTER TARGET URL..." 
                    class="w-full bg-black border border-white/10 p-5 rounded-2xl text-white text-center font-mono focus:border-purple-500 outline-none transition-all mb-6">
                <button onclick="launchProxy()" class="w-full bg-purple-600 py-4 rounded-xl font-black text-xs uppercase shadow-lg shadow-purple-500/30">Execute Ghost Injection</button>
            </div>
            <p class="mt-8 text-[10px] text-gray-600 italic">History is not recorded. Browsing occurs in a sandboxed about:blank environment.</p>
        </div>
    </div>

    <div id="ai-view" class="overlay-view">
        <div class="flex-1 flex flex-col">
            <div class="mb-4 flex justify-between">
                <h2 class="text-xl font-black text-purple-500 italic uppercase">Worth AI // Terminal</h2>
                <button onclick="showView('calc')" class="text-xs text-gray-500 uppercase font-bold">Close Terminal</button>
            </div>
            <iframe src="https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat" class="rounded-2xl border border-white/5 shadow-2xl"></iframe>
        </div>
    </div>

    <script>
        function showView(view) {
            // Hide all overlays
            document.querySelectorAll('.overlay-view').forEach(v => v.style.display = 'none');
            
            // Set active button
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            if (view === 'calc') {
                // Keep everything hidden to show the calcsolver frame
            } else {
                document.getElementById(view + '-view').style.display = 'flex';
                // Highlight the button (find by text)
                const buttons = document.querySelectorAll('.nav-btn');
                buttons.forEach(btn => {
                    if(btn.innerText.toLowerCase().includes(view)) btn.classList.add('active');
                });
            }
        }

        function launchProxy() {
            let url = document.getElementById('proxy-url').value;
            if(!url) return;
            if(!url.startsWith('http')) url = 'https://' + url;

            const win = window.open('about:blank', '_blank');
            win.document.title = 'Calculator'; 
            const f = win.document.createElement('iframe');
            f.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;background:white;";
            f.src = "https://www.croxyproxy.com/_p.php?u=" + encodeURIComponent(url);
            win.document.body.appendChild(f);
        }

        // PANIC KEY: `
        window.onkeydown = (e) => {
            if (e.key === '`') {
                const panic = document.getElementById('panic-overlay');
                panic.style.display = (panic.style.display === 'block') ? 'none' : 'block';
            }
        };
    </script>
</body>
</html>
