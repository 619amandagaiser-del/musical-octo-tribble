<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <script type="module" src="./cloaking.js"></script>
    <script type="module" src="./ai.js"></script>
    
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #161b22;
            --accent: #58a6ff;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; font-family: sans-serif; }
        
        /* Secret Trigger (Top Left Corner) */
        #secret-trigger {
            position: fixed; top: 0; left: 0; width: 30px; height: 30px;
            z-index: 10000; cursor: default; background: transparent;
        }

        /* Sidebar - Orbit AI Control Center */
        #sidebar {
            position: fixed; left: -400px; top: 0; width: 380px; height: 100vh;
            background: var(--panel); border-right: 3px solid var(--accent);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999;
            display: flex; flex-direction: column; color: var(--text);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #sidebar.active { left: 0; }

        /* Main Workspace (The Cover) */
        #main-view { width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        /* Orbit Chat Interface Integration */
        #chat-container { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        #chat { flex: 1; overflow-y: auto; margin-bottom: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); padding: 10px; border: 1px solid var(--border); }
        .input-area { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid var(--border); background: #0d1117; color: white; outline: none; }
        input:focus { border-color: var(--accent); }
        
        .tool-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
        select { width: 100%; padding: 8px; background: #0d1117; color: white; border: 1px solid var(--border); border-radius: 4px; }
        
        button#sendBtn { background: var(--accent); border: none; border-radius: 5px; padding: 0 15px; cursor: pointer; color: #000; font-weight: bold; }
        .close-btn { background: #f85149; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div id="secret-trigger" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div style="padding: 20px; text-align: center; background: #0d1117; border-bottom: 1px solid var(--border);">
            <h2 style="color: var(--accent); margin: 0; font-size: 1.2rem;">ORBIT CO-PILOT</h2>
            <div id="usageIndicator" style="font-size: 0.7rem; margin-top: 5px; color: #8b949e;">
                </div>
        </div>

        <div id="chat-container">
            <div id="chat"></div>
            
            <div class="input-area">
                <input type="text" id="textInput" placeholder="Message Orbit...">
                <button id="sendBtn">🚀</button>
            </div>
            
            <div class="tool-section">
                <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 5px;">ACTIVE CLOAK</label>
                <select id="cloak-select" data-cloak-select>
                    <option value="gdoc">Google Docs</option>
                    <option value="google">Google Search</option>
                    <option value="desmoscalc">Desmos</option>
                    <option value="blank">Blank Tab</option>
                </select>
            </div>

            <button class="close-btn" onclick="toggleSidebar()">Hide Interface</button>
        </div>
    </div>

    <div id="main-view">
        <iframe src="https://calcsolver.net/"></iframe>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
        }

        // Global Panic/Hide listener
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                sidebar.classList.remove('active');
            }
        });
    </script>
</body>
</html>
