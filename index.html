<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>G-HUB TITAN // POLISHED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #5ca3ff; --bg: #03070b; --glass: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-btn.active { color: var(--accent); border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(92,163,255,0.1) 0%, transparent 100%); }
        #decoy-overlay { position: fixed; inset: 0; z-index: 99999; background: white; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex">

    <div id="decoy-overlay">
        <iframe src="https://en.wikipedia.org/wiki/Special:Random"></iframe>
    </div>

    <div class="fixed bottom-6 right-6 z-[999] group">
        <div id="ai-status" class="absolute -top-12 right-0 glass px-4 py-2 rounded-2xl text-[9px] font-black text-blue-400 uppercase opacity-0 transition-all">Titan-AI: Reading Screen</div>
        <button onclick="triggerAIVision()" class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-lg hover:scale-110 active:scale-90 transition-all border-2 border-white/20">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>
    </div>

    <nav class="w-20 md:w-64 bg-black border-r border-white/5 flex flex-col p-6 z-50">
        <div class="mb-10 p-2 bg-blue-600/5 rounded-xl border border-blue-500/10">
            <h1 class="font-black text-[10px] text-blue-400 uppercase tracking-tighter">Vista Unified</h1>
            <p class="text-[7px] text-gray-500 font-bold uppercase">Portal v53</p>
        </div>

        <div class="space-y-1 flex-1 overflow-y-auto">
            <button onclick="switchView('games')" id="btn-games" class="sidebar-btn active w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase transition-all">🎮 Database</button>
            <button onclick="switchView('ai-assistant')" id="btn-ai-assistant" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase transition-all">🧠 Titan AI</button>
            <button onclick="switchView('cloak')" id="btn-cloak" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase transition-all">🟣 Proxies</button>
            <button onclick="switchView('terminal')" id="btn-terminal" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase transition-all">📟 Terminal</button>
        </div>
        
        <button onclick="toggleDecoy()" class="mt-4 p-4 glass rounded-2xl text-[9px] font-black uppercase text-red-500">Stealth Mode ( ` )</button>
    </nav>

    <main class="flex-1 relative flex flex-col p-6 overflow-hidden">
        <div id="games-view" class="flex-1 overflow-y-auto">
            <input type="text" id="search-bar" oninput="searchGames()" placeholder="SEARCH TITLES..." class="w-full mb-6 bg-white/5 border border-white/10 p-4 rounded-xl text-sm outline-none focus:border-blue-500">
            <div id="grid" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div>
        </div>

        <div id="ai-assistant-view" class="hidden flex-1 flex flex-col">
            <iframe class="rounded-3xl glass" src="https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat"></iframe>
        </div>

        <div id="cloak-view" class="hidden flex-1 flex flex-col items-center justify-center">
            <div class="glass p-10 rounded-3xl text-center">
                <h2 class="text-4xl font-black italic mb-6">SHADOW</h2>
                <button onclick="launchCloak('https://gointerstellar.app')" class="px-10 py-4 bg-blue-600 rounded-full font-black uppercase">Launch Interstellar</button>
            </div>
        </div>
    </main>

    <script>
        // Core Logic
        function switchView(v) {
            const views = ['games-view', 'ai-assistant-view', 'cloak-view'];
            views.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(v + '-view').classList.remove('hidden');
            document.getElementById('btn-' + v).classList.add('active');
        }

        function toggleDecoy() {
            const d = document.getElementById('decoy-overlay');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        function launchCloak(url) {
            const win = window.open('about:blank', '_blank');
            if(win) {
                win.document.title = 'My Drive - Google Drive';
                const f = win.document.createElement('iframe');
                f.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;";
                f.src = url;
                win.document.body.appendChild(f);
            }
        }

        window.addEventListener('keydown', (e) => { if(e.key === '`') toggleDecoy(); });
    </script>
</body>
</html>
