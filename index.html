<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vista Unified // Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #5ca3ff; --bg: #03070b; --nav: #0d1117; --glass: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-btn.active { color: var(--accent); border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(92,163,255,0.1) 0%, transparent 100%); }
        .shadow-browser { background: #000; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .shadow-logo-text { font-size: 80px; font-weight: 900; color: var(--accent); letter-spacing: -4px; text-shadow: 0 0 50px var(--accent); opacity: 0.8; }
        #decoy-overlay { position: fixed; inset: 0; z-index: 99999; background: white; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="flex">

    <div id="decoy-overlay">
        <iframe src="https://en.wikipedia.org/wiki/Special:Random"></iframe>
        <div onclick="toggleDecoy()" class="fixed bottom-0 right-0 w-16 h-16 cursor-help"></div>
    </div>

    <div class="fixed bottom-6 right-6 z-[999] group">
        <div id="ai-status" class="absolute -top-12 right-0 glass px-4 py-2 rounded-2xl text-[9px] font-black text-blue-400 uppercase opacity-0 group-hover:opacity-100 transition-all pointer-events-none">Titan-AI: Reading Screen</div>
        <button onclick="triggerAIVision()" class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-lg hover:scale-110 active:scale-90 transition-all border-2 border-white/20">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span class="absolute top-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#03070b] rounded-full"></span>
        </button>
    </div>

    <nav class="w-20 md:w-64 bg-black border-r border-white/5 flex flex-col p-6 z-50">
        <div class="mb-10 p-2 bg-blue-600/5 rounded-xl border border-blue-500/10">
            <h1 class="font-black text-[10px] text-blue-400 uppercase tracking-tighter">Vista Unified</h1>
            <p class="text-[7px] text-gray-500 font-bold uppercase">Portal v53</p>
        </div>
        
        <div class="space-y-1 flex-1 overflow-y-auto">
            <a href="https://login.classlink.com/my/vistausd" target="_blank" class="w-full p-3 flex items-center gap-4 text-[11px] font-bold text-gray-300 hover:text-blue-400 transition-all">📘 ClassLink</a>
            <div class="my-4 border-t border-white/5 pt-4"></div>
            <button onclick="switchView('games')" id="btn-games" class="sidebar-btn active w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">🎮 Database</button>
            <button onclick="switchView('ai-assistant')" id="btn-ai-assistant" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">🧠 Titan AI</button>
            <button onclick="switchView('cloak')" id="btn-cloak" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">🟣 Proxies</button>
            <button onclick="switchView('hidden-browser')" id="btn-hidden-browser" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">📟 Terminal</button>
            <button onclick="switchView('settings')" id="btn-settings" class="sidebar-btn w-full p-3 flex items-center gap-4 text-[11px] font-bold uppercase text-gray-400 transition-all">⚙️ Settings</button>
        </div>
        <button onclick="toggleDecoy()" class="mt-4 p-4 glass rounded-2xl text-[9px] font-black uppercase text-red-500 border-red-500/10">Stealth Mode</button>
    </nav>

    <main class="flex-1 relative flex flex-col p-6 overflow-hidden">
        
        <div id="grid-container" class="flex-1 overflow-y-auto"><div id="grid" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div></div>

        <div id="ai-assistant-view" class="hidden flex-1 flex flex-col">
            <div class="glass flex-1 rounded-3xl overflow-hidden flex flex-col">
                <div class="p-4 border-b border-white/5 bg-blue-500/5 text-[10px] font-black uppercase tracking-widest text-blue-400">Titan Academic Assistant</div>
                <iframe src="https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat"></iframe>
            </div>
        </div>

        <div id="cloak-view" class="hidden flex-1">
            <div class="shadow-browser flex-1 h-full flex flex-col">
                <div class="p-4 bg-[#0d1117] text-[10px] font-mono text-blue-400">shadow://external-bridge</div>
                <div class="flex-1 flex flex-col items-center justify-center gap-8">
                    <h2 class="shadow-logo-text italic uppercase">Shadow</h2>
                    <div class="flex gap-4">
                        <button onclick="launchCloak('https://ai-wedge.github.io')" class="px-8 py-4 bg-blue-600 rounded-full font-black text-xs uppercase">Launch AI Wedge</button>
                        <button onclick="launchCloak('https://gointerstellar.app')" class="px-8 py-4 glass rounded-full font-black text-xs uppercase">Interstellar</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="hidden-browser-view" class="hidden flex-1 flex flex-col">
            <div class="glass flex-1 rounded-3xl overflow-hidden flex flex-col">
                <div class="p-2 bg-black flex items-center gap-4 px-6 border-b border-white/5">
                    <span class="text-[9px] font-mono text-green-500">SYS_LOG:</span>
                    <input type="text" id="browser-url" class="bg-transparent text-[10px] text-green-500 outline-none w-full" placeholder="Enter URL..." onkeypress="if(event.key==='Enter') launchHiddenTab()">
                </div>
                <iframe id="browser-frame" class="hidden"></iframe>
                <div id="browser-placeholder" class="flex-1 flex items-center justify-center font-mono text-green-900 text-[10px]">Awaiting terminal link...</div>
            </div>
        </div>

        <div id="settings-view" class="hidden flex-1 p-10">
            <h2 class="text-3xl font-black italic uppercase mb-10">Engine Prefs</h2>
            <div class="glass p-8 rounded-3xl max-w-md">
                <p class="text-[10px] font-black text-gray-500 mb-4">THEME COLOR</p>
                <input type="color" id="color-picker" oninput="updateTheme(this.value)" class="w-full h-12 bg-transparent border-none cursor-pointer">
            </div>
        </div>
    </main>

    <script>
        let allGames = [];
        async function init() {
            const savedColor = localStorage.getItem('titan_theme') || '#5ca3ff';
            updateTheme(savedColor);
            try {
                const res = await fetch('https://raw.githubusercontent.com/selenite-cc/selenite-old/main/games.json');
                const data = await res.json();
                allGames = Object.keys(data).map(k => ({ title: data[k].name || k, url: `https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${k}/index.html`, img: `https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@main/${k}/${data[k].img || 'cover.svg'}` }));
                render(allGames);
            } catch(e) { console.error("Database Down"); }
        }

        function switchView(v) {
            ['grid-container', 'ai-assistant-view', 'cloak-view', 'hidden-browser-view', 'settings-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+v).classList.add('active');
            if(v === 'games') document.getElementById('grid-container').classList.remove('hidden');
            else document.getElementById(v + '-view').classList.remove('hidden');
        }

        function render(list) {
            const g = document.getElementById('grid'); g.innerHTML = '';
            list.forEach(i => {
                const d = document.createElement('div');
                d.className = "glass p-2 rounded-2xl cursor-pointer hover:border-blue-500 transition-all";
                d.onclick = () => launchCloak(i.url);
                d.innerHTML = `<img src="${i.img}" class="w-full aspect-[3/4] object-cover rounded-xl mb-2" onerror="this.src='https://raw.githubusercontent.com/selenite-cc/selenite-old/main/cover.svg'"><div class="text-[8px] font-black text-center truncate text-gray-500 uppercase">${i.title}</div>`;
                g.appendChild(d);
            });
        }

        function launchCloak(url) {
            const win = window.open('about:blank', '_blank');
            if(win) {
                win.document.title = 'My Drive - Google Drive';
                const f = win.document.createElement('iframe'); f.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;"; f.src = url; f.allow = "autoplay; gamepad; haptic-feedback; keyboard; fullscreen"; win.document.body.appendChild(f);
            } else { alert("Enable Pop-ups in Chrome Settings!"); }
        }

        async function triggerAIVision() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" } });
                stream.getTracks().forEach(t => t.stop());
                switchView('ai-assistant');
                document.getElementById('ai-status').style.opacity = "1";
                setTimeout(() => document.getElementById('ai-status').style.opacity = "0", 3000);
            } catch (err) { console.error("Vision Denied"); }
        }

        function launchHiddenTab() {
            const url = document.getElementById('browser-url').value;
            const f = document.getElementById('browser-frame');
            f.src = url.startsWith('http') ? url : 'https://' + url;
            f.classList.remove('hidden');
            document.getElementById('browser-placeholder').classList.add('hidden');
        }

        function updateTheme(c) { document.documentElement.style.setProperty('--accent', c); localStorage.setItem('titan_theme', c); }
        function toggleDecoy() { const d = document.getElementById('decoy-overlay'); d.style.display = (d.style.display === 'block') ? 'none' : 'block'; }
        window.addEventListener('keydown', (e) => { if(e.key === '`') toggleDecoy(); });
        init();
    </script>
</body>
</html>
